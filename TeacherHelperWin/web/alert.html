<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>提醒</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#ffffff;
    font:13px/1.6 "Microsoft YaHei UI","Microsoft YaHei","Segoe UI",system-ui,sans-serif;color:#1d1d1f;
    -webkit-user-select:none;user-select:none}
  .wrap{padding:14px 16px 12px;display:flex;flex-direction:column;height:100%;box-sizing:border-box}
  .hd{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
  .hd .bell{color:#f0a020;font-size:15px}
  .title{font-size:14px;margin:8px 0 4px;font-weight:500;word-break:break-all;
    max-height:44px;overflow:hidden}
  .tip{color:#6e6e73;font-size:11.5px}
  .sp{flex:1}
  .btns{display:flex;align-items:center;gap:8px}
  select{font:inherit;padding:3px 6px;border:1px solid #d6d6db;border-radius:6px;background:#fff}
  button{font:inherit;padding:4px 12px;border-radius:7px;border:1px solid #d6d6db;background:#fff;cursor:default}
  button:hover{background:#f2f2f4}
  button.primary{background:#0a84ff;border-color:#0a84ff;color:#fff}
  button.primary:hover{filter:brightness(1.06)}
  button.link{border:none;background:transparent;color:#0a84ff;padding:4px 6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><span class="bell">🔔</span><span id="hd">提醒</span></div>
  <div class="title" id="title">加载中…</div>
  <div class="tip">本窗口不会锁住面板，可先到教师助手处理完再回来点。</div>
  <div class="sp"></div>
  <div class="btns">
    <select id="snooze">
      <option value="600">10 分钟后</option>
      <option value="1800" selected>30 分钟后</option>
      <option value="3600">1 小时后</option>
      <option value="7200">2 小时后</option>
      <option value="86400">明天再提醒</option>
    </select>
    <button onclick="act('snooze')">等会处理</button>
    <div class="sp"></div>
    <button class="link" id="openURL" style="display:none" onclick="act('open-url')">打开链接</button>
    <button class="primary" onclick="act('done')">马上处理</button>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search);
const id = q.get('id') || '';
const isTest = q.get('test') === '1';
let reminder = null;

function p2(n){ return String(n).padStart(2,'0'); }

async function init(){
  if (isTest) {
    document.getElementById('title').textContent = '这是一条测试提醒（用来确认弹窗正常）';
    document.getElementById('hd').textContent = '提醒 · ' + p2(new Date().getHours()) + ':' + p2(new Date().getMinutes());
    document.title = '测试提醒';
    return;
  }
  try {
    const data = await (await fetch('/api/data')).json();
    const list = data['reminders.json'] || [];
    reminder = list.find(r => r.id === id) || null;
    if (!reminder) { document.getElementById('title').textContent = '（这条提醒已被删除）'; return; }
    const hhmm = p2(reminder.hour) + ':' + p2(reminder.minute);
    document.getElementById('hd').textContent = '提醒 · ' + hhmm;
    document.getElementById('title').textContent = reminder.title || '';
    document.title = '提醒 · ' + hhmm;
    if (reminder.url) {
      const b = document.getElementById('openURL');
      b.style.display = '';
      b.title = reminder.url;
    }
  } catch (e) {
    document.getElementById('title').textContent = '读取提醒失败：' + e;
  }
}

function dayStr(d){ return d.getFullYear() + '-' + p2(d.getMonth()+1) + '-' + p2(d.getDate()); }

async function act(kind){
  const seconds = Number(document.getElementById('snooze').value);
  try {
    if (kind === 'open-url' && reminder && reminder.url) {
      await fetch('/api/open?target=url&url=' + encodeURIComponent(reminder.url), { method: 'POST' });
    }
    // 点「马上处理 / 打开链接」= 处理完成：一次性提醒写 completedOn（与 macOS 版语义一致）
    if ((kind === 'done' || kind === 'open-url') && reminder && !isTest) {
      const data = await (await fetch('/api/data')).json();
      const list = data['reminders.json'] || [];
      const r = list.find(x => x.id === id);
      if (r) {
        const oneShot = (!r.weekdays || !r.weekdays.length) && !r.longCycle;
        if (oneShot) r.completedOn = dayStr(new Date());
        await fetch('/api/save?file=' + encodeURIComponent('reminders.json'), { method: 'POST', body: JSON.stringify(list) });
      }
    }
    await fetch('/api/alert/action', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id, action: kind, seconds: seconds })
    });
  } catch (e) { /* 关窗由主程序兜底 */ }
  window.close();
  setTimeout(() => fetch('/api/alert/close?id=' + encodeURIComponent(id), { method: 'POST' }).catch(() => {}), 120);
}

init();
</script>
</body>
</html>
